<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ✅ Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Rajithran's official full-stack portfolio site — showcasing powerful MERN projects, next-gen UI, and developer excellence." />
    <meta name="theme-color" content="#0d0d0d" />

    <title>Rajithran Portfolio</title>

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

    <!-- ✅ Canonical URL (SEO Boost) -->
    <link rel="canonical" href="https://rajithran-portfolio.netlify.app" />

    <!-- ✅ Google Fonts Performance Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload fonts to avoid render-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" />

    <!-- Load font styles non-blocking -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" media="all" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet" media="all" />

    <!-- ✅ Open Graph Meta (for social sharing) -->
    <meta property="og:title" content="Rajithran Portfolio" />
    <meta property="og:description" content="Rajithran's official full-stack portfolio site — showcasing powerful MERN projects, next-gen UI, and developer excellence." />
    <meta property="og:image" content="https://rajithran-portfolio.netlify.app/cover.jpg" />
    <meta property="og:url" content="https://rajithran-portfolio.netlify.app" />
    <meta property="og:type" content="website" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rajithran Portfolio" />
    <meta name="twitter:description" content="Rajithran's official full-stack portfolio site — powerful MERN projects & developer excellence." />
    <meta name="twitter:image" content="https://rajithran-portfolio.netlify.app/cover.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
